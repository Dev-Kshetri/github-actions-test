name: Chapter 3 Master Workflow

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'

  workflow_dispatch:
    inputs:
      user_name:
        description: 'Choose who to greet'
        required: true
        default: 'Ashok'
        type: choice
        options:
          - Ashok
          - Ritu
          - Kiara

# 1. WORKFLOW-LEVEL ENVIRONMENT VARIABLES
# Available to every job and step in this entire file
env:
  APP_NAME: "GitHub-Actions-Masterclass"
  VERSION: "1.0.0"

jobs:
  # ==========================================
  # JOB 1: Build Phase
  # ==========================================
  build:
    name: Build Job
    runs-on: ubuntu-latest # 2. RUNNER CONFIGURATION (GitHub-hosted cloud runner)
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Build application assets
        run: |
          echo "Building application: ${{ env.APP_NAME }} (v${{ env.VERSION }})"
          echo "Build completed successfully!"

  # ==========================================
  # JOB 2: Test Phase
  # ==========================================
  test:
    name: Test Job
    needs: build # 3. JOB DEPENDENCY (Wont start until 'build' succeeds)
    runs-on: ubuntu-latest
    steps:
      - name: Run automated test suite
        env:
          # STEP-LEVEL ENVIRONMENT VARIABLE (Only available inside this step)
          TEST_TYPE: "integration-tests"
        run: |
          echo "Running ${{ env.TEST_TYPE }} for ${{ env.APP_NAME }}..."
          echo "All tests passed cleanly!"

  # ==========================================
  # Job 3: Deploy Phase
  # ==========================================
  deploy:
    name: Deploy Job
    needs: test # 3. JOB DEPENDENCY (Wont start until 'test' succeeds)
    runs-on: ubuntu-latest
    steps:
      - name: Deploy application
        run: |
          echo "Deploying ${{ env.APP_NAME }} v${{ env.VERSION }}..."
          echo "Hello, ${{ inputs.user_name || 'Ashok' }}! Deployment finished successfully."