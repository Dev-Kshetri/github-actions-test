name: Chapter 2 Workflow Triggers

on:
  # 1. Trigger on push to main, but ignore changes to Markdown files
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'

  # 2. Manual trigger button in GitHub UI with a dropdown menu
  workflow_dispatch:
    inputs:
      user_name:
        description: 'Choose who to greet'
        required: true
        default: 'Ashok'
        type: choice
        options:
          - Ashok
          - Ritu
          - Kiara

jobs:
  test-triggers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Greet selected user
        run: |
          echo "Workflow triggered successfully!"
          echo "Hello, ${{ inputs.user_name }}!"